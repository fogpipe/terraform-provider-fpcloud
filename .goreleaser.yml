version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # A provider speaks gRPC and has no subcommand to print its notices from, so
    # the archive is the only thing that reaches whoever runs `tofu init` — and
    # the licences of the modules compiled in oblige whoever distributes the
    # binary, which is us, through the registry.
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES.md

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

# No changelog block: the release notes are the annotated tag's message, passed
# as --release-notes by .github/workflows/release.yml, which skips GoReleaser's
# own generation. `changelog: disable: true` would skip the pipe that loads that
# file too, and every provider release from v0.196.0 to v0.220.0 shipped with an
# empty body because of it (fogpipe/cloud-workspace#1288).
