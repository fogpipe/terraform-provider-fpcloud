name: acceptance

# Terraform acceptance tests (TF_ACC) run against a LIVE fpcloud API — they
# create and destroy real projects, apps, and buckets. They are therefore NOT
# run on every PR: the release dispatches them once the new version is serving,
# a person dispatches them by hand, and the weekly schedule catches "Provider
# produced inconsistent result after apply" regressions in a week nothing
# shipped. Whatever starts a run, it checks out the provider at the tag the API
# serves (below), so every run tests a released pair.
#
# Required repo config:
#   secrets.FPCLOUD_API_KEY      — an fpcloud API key (fp-...) for a throwaway org
#   vars.FPCLOUD_API_URL         — API base URL (defaults to prod if unset)
#   vars.FPCLOUD_ACC_SWEEP_ORG   — the throwaway org's name. Before the tests
#                                  start, the suite deletes that org's projects
#                                  older than 35 minutes — what a cancelled run
#                                  or a failed teardown left behind, since a
#                                  killed process never reaches its teardown.
#                                  Unset, nothing is swept
#                                  and leaks count against the org's project
#                                  bound until someone clears them by hand.
on:
  workflow_dispatch:
    inputs:
      run:
        description: "go test -run pattern — one test's name to verify just that test, the default to run them all"
        default: "TestAcc"
        required: false
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

# One run at a time. Every run shares the throwaway org's ceilings, which hold
# only a couple of databases, so two overlapping runs refuse each other's.
# The running one is never cancelled; a newer dispatch waits behind it.
concurrency:
  group: acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      # The suite tests the provider the API it talks to was released with. The
      # three repos share one version number, so the version the API reports is
      # the provider tag to check out. Testing main instead applied a provider
      # nobody can install against an API that had not shipped its half of a
      # wire change yet, and a scheduled run inside that window failed on
      # nothing anyone could act on. An unreleased provider is tested with
      # `just testacc` from a checkout.
      - name: Read the version the API serves
        id: served
        env:
          FPCLOUD_API_URL: ${{ vars.FPCLOUD_API_URL }}
        run: |
          tag="$(curl --fail --silent --show-error --max-time 10 "${FPCLOUD_API_URL:-https://api.cloud.fogpipe.com}/version" | jq --raw-output '.version // empty')"
          [ -n "$tag" ] || { echo "::error::the API reported no version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "testing the provider at $tag"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.served.outputs.tag }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # Install the Terraform CLI ourselves and point the test framework at it via
      # TF_ACC_TERRAFORM_PATH, so terraform-plugin-testing skips its own hc-install
      # download+GPG-verify path (HashiCorp's embedded signing key has expired →
      # "openpgp: key expired").
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Pin Terraform path for the test framework
        run: echo "TF_ACC_TERRAFORM_PATH=$(which terraform)" >> "$GITHUB_ENV"
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          FPCLOUD_API_KEY: ${{ secrets.FPCLOUD_API_KEY }}
          FPCLOUD_API_URL: ${{ vars.FPCLOUD_API_URL }}
          FPCLOUD_ACC_SWEEP_ORG: ${{ vars.FPCLOUD_ACC_SWEEP_ORG }}
        run: go test ./internal/provider/ -run "${{ inputs.run || 'TestAcc' }}" -v -timeout 30m
