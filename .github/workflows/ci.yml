name: ci

# Everything that can be checked without touching a live API. The acceptance
# suite is the other half and stays on its own schedule, because it creates and
# destroys real resources — so until this existed, a push to main was verified by
# nothing at all for up to a week.
#
# The docs/ tree is generated from the schema (`just docs`) and is not checked
# here: that needs OpenTofu and a provider binary, and it drifted unnoticed for
# exactly that reason. See fogpipe/cloud-workspace#6.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build, vet and test
    runs-on: fpcloud
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # No go.work here, deliberately: this repo is built alone, so a client
      # version that only resolves inside the workspace tree fails here rather
      # than at a tenant's `tofu init`.
      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      # Symbol-level: red for a vulnerability on a path this code calls, quiet
      # for one in a module it merely carries. A fresh advisory turns main red
      # with no commit behind it, which is when the bump is owed
      # (fogpipe/cloud-workspace#340).
      - name: no vulnerability on a path the code calls
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # Does this provider still cover the client it wraps? Both gates read
  # cloud-cli at the version go.mod pins, so the verdict is the commit's own
  # (fogpipe/cloud-workspace#152); see scripts/client-module.ts.
  coverage:
    name: client coverage
    runs-on: fpcloud
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: the gates read the client go.mod pins
        run: deno test --allow-read --allow-run --allow-env scripts/

      - name: every client method has a resource/data source surface (or is baselined)
        run: deno run --allow-read --allow-run --allow-env scripts/tf-resource-coverage.ts

      - name: every client field has a schema attribute (or is baselined)
        run: deno run --allow-read --allow-run --allow-env scripts/tf-field-coverage.ts

      # The archive carries the notices its dependencies' licences require, and
      # a generated file goes stale on the next `go get` — a stale attribution
      # being the same breach wearing a fix. Regenerating here is what makes
      # adding a dependency without attributing it fail the build.
      - name: third-party licenses are attributed
        run: deno run --allow-read --allow-run --allow-env scripts/third-party-licenses.ts --check
